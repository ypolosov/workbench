# Tests (bats), linting (shellcheck) and formatting (shfmt) on every change: make check
# on Linux; the tests alone on macOS and on Windows (Git Bash).
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    # Private copies of the template (personal knowledge bases) skip the run.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck shfmt
      - name: make check
        run: make check

  macos:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The system bash 3.2 garbles non-ASCII test names in bats: use a current bash.
      - name: Tools
        run: brew install bash bats-core
      - name: Tests
        run: bats tests

  windows:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: npm install -g bats && jq --version
      - name: Tests
        run: bats tests
